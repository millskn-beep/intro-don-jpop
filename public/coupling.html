<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カップリング曲の管理｜イントロドン！J-POP</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="songs.css">
<style>
  .cp { max-width: 960px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  .cp-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cp-bar input { flex: 1 1 220px; min-width: 0; margin: 0; padding: 8px 12px; }
  .cp-bar .btn-sub, .cp-row .btn-sub, .cp-row .btn-main { width: auto; margin: 0; padding: 6px 14px; font-size: 13px; }
  .cp-tabs button.on { border-color: var(--accent); }
  .cp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .cp-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); }
  .cp-row > div { display: grid; min-width: 0; flex: 1; }
  .cp-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-row small { color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cp-row a { font-size: 12px; }
  .cp-row.off { opacity: .55; }
  .cp-row.sent { opacity: .6; }
  .cp-mode { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
</style>
</head>
<body class="songs-page">
<div class="backdrop" aria-hidden="true"></div>
<main class="cp">
  <a class="btn-sub" href="songs.html" style="width:auto;justify-self:start">← 収録曲一覧</a>
  <h2>カップリング曲の管理 <small id="count"></small> <span class="cp-mode" id="mode"></span></h2>
  <p class="note" id="intro"></p>
  <div class="cp-bar cp-tabs">
    <button class="btn-sub on" data-tab="on" type="button">印がある曲</button>
    <button class="btn-sub" data-tab="add" type="button">印を付ける</button>
    <button class="btn-sub" data-tab="off" type="button" id="offTab">戻した曲</button>
    <button class="btn-sub" data-tab="req" type="button" id="reqTab" hidden>届いた提案</button>
    <input id="q" placeholder="曲名・歌手・作品で探す" autocomplete="off">
  </div>
  <ul class="cp-list" id="list"><li>読み込み中…</li></ul>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = m => { $('toast').textContent = m; $('toast').hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { $('toast').hidden = true; }, 2600); };
let songs = [], tab = 'on', reverted = new Set(), canEdit = false, reqs = {}, sent = new Set();
async function load() {
  const res = await fetch('/api/coupling'), j = await res.json();
  if (!res.ok) { $('list').innerHTML = `<li>${esc(j.error || '読み込めませんでした')}</li>`; return; }
  songs = j.songs; canEdit = !!j.canEdit;
  $('mode').textContent = canEdit ? '管理者（このPC）' : '提案を送る';
  $('intro').textContent = canEdit
    ? '部屋の設定「カップリング曲：出さない」で出題から外れる曲の一覧です。「戻す」を押すと、カップリング曲の印を外して、ふつうの曲に戻します。印を付けたい曲は「印を付ける」で探せます。公開サイトから届いた提案は「届いた提案」で承認します（先に tools/pull-fixes.js で取り込みます）。'
    : '部屋の設定「カップリング曲：出さない」で出題から外れる曲の一覧です。「カップリング曲ではない」「カップリング曲です」と思う曲は、ボタンで提案を送れます（管理者が確認して、次の更新で反映します）。';
  $('offTab').hidden = !canEdit; $('reqTab').hidden = !canEdit;
  if (canEdit) { try { reqs = (await (await fetch('/api/coupling-reports')).json())['coupling-reports'] || {}; } catch (e) { reqs = {}; } }
  render();
}
function render() {
  const q = $('q').value.trim().toLowerCase();
  const hit = s => !q || `${s.title} ${s.artist} ${s.work}`.toLowerCase().includes(q);
  const on = songs.filter(s => s.coupling), nReq = Object.keys(reqs).length;
  $('count').textContent = `（印がある曲 ${on.length}曲）`;
  $('reqTab').textContent = `届いた提案${nReq ? `（${nReq}）` : ''}`;
  document.querySelectorAll('.cp-tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const byId = new Map(songs.map(s => [s.id, s]));
  const link = s => `<a href="https://www.youtube.com/watch?v=${esc(s.id)}" target="_blank" rel="noopener">▶ 聴く</a>`;
  const info = s => `<div><b>${esc(s.title)}</b><small>${esc(s.artist)}／${esc(s.work)}（${s.year}）${s.couplingOf ? '／c/w：' + esc(s.couplingOf) : ''}</small></div>`;
  const act = s => {
    if (canEdit) return s.coupling ? `<button class="btn-sub" data-id="${esc(s.id)}" data-on="0" type="button">戻す</button>` : `<button class="btn-main" data-id="${esc(s.id)}" data-on="1" type="button">${tab === 'off' ? 'もう一度 印を付ける' : '印を付ける'}</button>`;
    if (sent.has(s.id)) return '<span class="note">送りました</span>';
    return s.coupling ? `<button class="btn-sub" data-send="${esc(s.id)}" data-on="0" type="button">カップリング曲ではない</button>` : `<button class="btn-main" data-send="${esc(s.id)}" data-on="1" type="button">カップリング曲です</button>`;
  };
  let list, html;
  if (tab === 'req') {
    html = Object.entries(reqs).map(([id, r]) => { const s = byId.get(id); if (!s) return ''; return `<li class="cp-row"><div><b>${esc(s.title)}</b><small>${esc(s.artist)}／${esc(s.work)}｜提案：${r.on ? '<b>カップリング曲です</b>' : '<b>ふつうの曲に戻して</b>'}（${r.n}件）${(r.notes || []).map(n => '｜' + esc(n.note)).join('')}</small></div>${link(s)}
      <button class="btn-main" data-resolve="${esc(id)}" data-apply="1" type="button">承認</button><button class="btn-sub" data-resolve="${esc(id)}" data-apply="0" type="button">却下</button></li>`; }).join('') || '<li class="note">届いている提案はありません</li>';
  } else {
    if (tab === 'on') list = on.filter(hit);
    else if (tab === 'off') list = songs.filter(s => reverted.has(s.id) && hit(s));
    else list = q ? songs.filter(s => !s.coupling && hit(s)).slice(0, 40) : [];
    html = list.map(s => `<li class="cp-row${tab === 'off' ? ' off' : ''}${sent.has(s.id) ? ' sent' : ''}">${info(s)}${link(s)}${act(s)}</li>`).join('')
      || `<li class="note">${tab === 'add' ? '曲名・歌手・作品を入れて探してください' : tab === 'off' ? 'まだ戻した曲はありません' : 'ありません'}</li>`;
  }
  $('list').innerHTML = html;
}
$('list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.send) { // 提案を送る（公開サイト）
    const id = b.dataset.send, on = b.dataset.on === '1', note = on ? '' : (prompt('よければ理由やひとこと（空でもOK）') ?? null);
    if (note === null) return;
    b.disabled = true;
    const res = await fetch('/api/coupling-reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, on, note }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { b.disabled = false; return toast(j.error || '送れませんでした'); }
    sent.add(id); toast(j.message || '送りました'); render(); return;
  }
  if (b.dataset.resolve) { // 提案の承認・却下（このPC）
    const id = b.dataset.resolve, apply = b.dataset.apply === '1';
    const res = await fetch('/api/coupling-reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, resolve: true, apply }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) return toast(j.error || '変えられませんでした');
    if (apply) { const s = songs.find(x => x.id === id); if (s) s.coupling = !!reqs[id]?.on; }
    delete reqs[id]; toast(apply ? '承認しました' : '却下しました'); render(); return;
  }
  if (!b.dataset.id) return;
  const id = b.dataset.id, on = b.dataset.on === '1';
  b.disabled = true;
  const res = await fetch('/api/coupling', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, on }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { b.disabled = false; return toast(j.error || '変えられませんでした'); }
  const s = songs.find(x => x.id === id); s.coupling = on; if (!on) reverted.add(id); else reverted.delete(id);
  toast(on ? `「${s.title}」にカップリング曲の印を付けました` : `「${s.title}」を、ふつうの曲に戻しました`);
  render();
};
document.querySelectorAll('.cp-tabs [data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$('q').oninput = render;
load();
</script>
</body>
</html>
