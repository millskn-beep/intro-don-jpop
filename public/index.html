<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アニソンイントロ対戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<!-- YouTube は画面全体の背景に置く。出題中は見えず、答え合わせで透けて見える -->
<div class="video-bg" aria-hidden="true"><div id="player"></div></div>
<main>
  <header class="top">
    <div class="brand">
      <img class="emblem" id="emblem" src="assets/glass/logo.webp" alt="">
      <h1 class="logo"><small>ANISONG INTRO BATTLE</small>アニソン<em>イントロ</em>対戦</h1>
    </div>
    <span class="code" id="roomCode" hidden></span>
  </header>

  <!-- ホーム -->
  <section id="home" class="panel hero">
    <p class="tagline">イントロが流れたら、誰よりも早く答えよう。</p>
    <label>名前<input id="nameInput" maxlength="12" placeholder="ニックネーム"></label>
    <div class="create-row">
      <label>部屋名（任意）<input id="roomNameInput" maxlength="20" placeholder="〇〇の部屋"></label>
      <label>パスワード（任意）<input id="roomPassInput" maxlength="32" placeholder="なしなら誰でも入れます" autocomplete="off"></label>
    </div>
    <button class="btn-main" id="createBtn">部屋を立てる</button>
    <div class="join-row">
      <input id="codeInput" maxlength="6" placeholder="合言葉（6文字）" autocapitalize="characters">
      <button class="btn-sub" id="joinBtn">入る</button>
    </div>
    <p class="error" id="homeError"></p>
  </section>

  <!-- 部屋一覧 -->
  <section id="roomListPanel" class="panel">
    <div class="list-head">
      <h3>公開中の部屋 <span id="roomCount"></span></h3>
      <div class="list-filter" id="listFilter">
        <button class="btn-sub on" data-f="all">すべて</button>
        <button class="btn-sub" data-f="lobby">募集中</button>
        <button class="btn-sub" data-f="playing">対戦中</button>
      </div>
    </div>
    <ul class="room-list" id="roomList"></ul>
  </section>

  <!-- 部屋 -->
  <section id="room" hidden>
    <!-- 左：プレイヤー一覧 -->
    <aside class="panel room-side">
      <h3>プレイヤー</h3>
      <ul class="players" id="players"></ul>
      <label class="vol">音量<input type="range" id="volume" min="0" max="100" value="80"></label>
    </aside>

    <!-- 右：ゲーム画面 -->
    <div class="room-main">
    <div class="panel stage">
      <div class="cover" id="cover"><span>?</span></div>
      <div class="status">
        <div class="status-top">
          <span class="phase" id="phase">待機中</span>
          <span class="qno" id="qno"></span>
        </div>
        <div class="timer" id="timer">0.0</div>
        <div class="bar"><i id="barFill"></i><b id="barMark"></b></div>
      </div>
    </div>

    <!-- 待機中 -->
    <div id="lobby" class="panel">
      <div class="invite">
        <span>招待リンク</span>
        <input id="inviteUrl" readonly>
        <button class="btn-sub" id="copyBtn">コピー</button>
      </div>
      <div id="settings">
      <div class="settings">
        <label>お題<select data-key="topic"><option value="all">全部</option><option value="series">作品を選ぶ</option></select></label>
        <label id="seriesLabel" hidden>作品<select data-key="series"></select></label>
        <label>出題タイプ<select data-key="quizType"><option value="intro">イントロ</option><option value="sabimae">サビ前</option><option value="mix">イントロ＋サビ前（ランダム）</option></select></label>
        <label>問題数<select data-key="questions"></select></label>
      </div>
      <div class="modes" id="modes">
        <span>おまかせ設定</span>
        <button class="btn-sub" data-mode="easy">かんたん</button>
        <button class="btn-sub" data-mode="normal">ふつう</button>
        <button class="btn-sub" data-mode="hard">ガチ</button>
      </div>
      <details class="more">
        <summary>詳細設定</summary>
        <div class="settings">
        <label>サビ前：サビの何秒前から<select data-key="leadSec"></select></label>
        <label>答え合わせ後、自動で次へ<select data-key="autoNext"></select></label>
        <label>連続正解ボーナス・最終問題2倍<select data-key="bonus"><option value="true">あり</option><option value="false">なし</option></select></label>
        <label>回答方法<select data-key="answerMode"><option value="choice">選択肢から選ぶ</option><option value="input">曲名・作品名を入力</option></select></label>
        <label>時間で出るヒント<select data-key="clues"><option value="true">あり</option><option value="false">なし</option></select></label>
        <label>入力：ヒント3のあとの時間<select data-key="typingExtra"></select></label>
        <label>採点<select data-key="mode"><option value="score">スコア制（速いほど高得点）</option><option value="buzz">早押し制（最速の正解者のみ）</option></select></label>
        <label>選択肢<select data-key="choices"></select></label>
        <label>イントロの長さ<select data-key="introLen"></select></label>
        <label>サビに移るまで<select data-key="hintAt"></select></label>
        <label>サビの長さ<select data-key="chorusLen"></select></label>
        <label>定員<select data-key="maxPlayers"></select></label>
        <label>年代（から）<select data-key="yearFrom"></select></label>
        <label>年代（まで）<select data-key="yearTo"></select></label>
        </div>
      </details>
      </div>
      <div class="presets" id="presets"></div>
      <p class="note" id="poolInfo"></p>
      <button class="btn-main" id="startBtn">ゲーム開始</button>
      <p class="note" id="waitHost" hidden>ホストがゲームを開始するのを待っています…</p>
    </div>

    <!-- 出題中 -->
    <div id="quiz" class="panel" hidden>
      <ul class="clues" id="clues"></ul>
      <div class="choices" id="choices"></div>
      <form class="answer-input" id="inputForm" hidden autocomplete="off">
        <input id="answerInput" maxlength="50" placeholder="曲名か作品名を入力" enterkeyhint="send">
        <button class="btn-main" id="sendBtn" type="submit">回答</button>
      </form>
      <div class="lifelines" id="lifelines">
        <button class="btn-sub skip" id="passBtn"><img class="icon" src="assets/glass/icon-skip.webp" alt="">次の曲へ</button>
      </div>
      <ul class="life-results" id="lifeResults" hidden></ul>
      <p class="note" id="quizNote"></p>
    </div>

    <!-- 答え合わせ -->
    <div id="result" class="panel" hidden>
      <div class="answer" id="answer"></div>
      <ul class="highlights" id="highlights"></ul>
      <div class="reactions" id="reactions"><button class="btn-sub" data-react="神曲">神曲</button><button class="btn-sub" data-react="知らん">知らん</button><button class="btn-sub" data-react="懐かしい">懐かしい</button><button class="btn-sub" data-react="惜しい">惜しい</button><button class="btn-sub" data-react="草">草</button><button class="btn-sub" data-react="天才">天才</button></div>
      <table class="results" id="results"></table>
      <button class="btn-main" id="nextBtn" hidden>次の問題へ</button>
      <p class="note" id="waitNext" hidden>ホストが次へ進むのを待っています…</p>
      <p class="note next-count" id="nextCount"></p>
    </div>

    <!-- 終了 -->
    <div id="over" class="panel" hidden>
      <h2 class="over-title">最終結果</h2>
      <ul class="titles" id="titles"></ul>
      <div class="podium" id="podium">
        <img id="podiumImg" src="assets/glass/podium.webp" alt="">
        <div class="places" id="places"></div>
      </div>
      <ol class="ranking" id="ranking"></ol>
      <button class="btn-main" id="lobbyBtn" hidden>部屋に戻る</button>
    </div>
    </div>
  </section>

  <div class="flash" id="flash" hidden></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast" hidden></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
