<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動で直した曲の確認｜アニソンイントロ対戦</title>
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="songs.css">
<style>
  body { background: #05060f; }
  .rv { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .rv h2 { margin: 6px 0 4px; }
  .rv-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .rv-tabs button { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--glass-strong); color: var(--sub); font: inherit; font-weight: 800; cursor: pointer; }
  .rv-tabs button.on { color: #fff; border-color: var(--accent); }
  .rv-main { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; }
  .rv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: calc(100vh - 190px); overflow-y: auto; }
  .rv-list li { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .rv-list li.on { border-color: var(--accent); background: var(--glass-strong); }
  .rv-list li small { color: var(--sub); }
  .rv-list .done { opacity: .5; }
  .rv-list .chg { font-family: var(--font-num); white-space: nowrap; }
  .rv-list .big { color: var(--warn); }
  .rv-side { position: sticky; top: 12px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass-strong); }
  .rv-side .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  .rv-side .btn-sub, .rv-side .btn-main { padding: 6px 12px; font-size: 13px; border-radius: 99px; margin: 0; width: auto; }
  .rv-side .val { font-family: var(--font-num); font-size: 18px; font-weight: 800; min-width: 70px; }
  .rv-keys { font-size: 11px; color: var(--sub); margin-top: 10px; line-height: 1.6; }
  @media (max-width: 900px) { .rv-main { grid-template-columns: 1fr; } .rv-side { position: static; } }
</style>
</head>
<body>
<main class="rv">
  <a class="btn-sub songs-link" href="songs.html">← 収録曲一覧</a>
  <h2>自動で直した曲の確認 <span id="count"></span></h2>
  <p class="note">自動の解析（tools/auto_fix.py）で直した曲・直さず一覧に出した曲を、聞きながら確かめます。決めた結果は曲データに入り、自動の解析の「正解」としても使われます（このPCから開いたときだけ使えます）。</p>
  <div class="rv-tabs" id="tabs">
    <button type="button" data-tab="intro">イントロを直した</button>
    <button type="button" data-tab="chorus">サビを直した</button>
    <button type="button" data-tab="pending">大きく動くので一覧だけ</button>
    <button type="button" data-tab="done">確認済み</button>
  </div>
  <div class="rv-main">
    <ul class="rv-list" id="list"><li>読み込み中…</li></ul>
    <aside class="rv-side" id="side" hidden>
      <b id="sTitle"></b><br><small id="sMeta"></small>
      <div class="ed-player" style="margin-top:8px"><div id="player"></div></div>
      <div class="row"><span>直す前</span><span class="val" id="vBefore"></span><button class="btn-sub" id="playBefore" type="button">▶ 聴く（1）</button></div>
      <div class="row"><span>自動の値</span><span class="val" id="vAfter"></span><button class="btn-sub" id="playAfter" type="button">▶ 聴く（2）</button></div>
      <p class="note" id="sNote"></p>
      <div class="row">
        <button class="btn-main" id="okBtn" type="button">✓ 自動の値でOK（Enter）</button>
        <button class="btn-sub" id="revertBtn" type="button">↩ 元に戻す（Backspace）</button>
      </div>
      <div class="row"><span>手で決める</span><span class="val" id="vManual"></span>
        <button class="btn-sub" data-d="-1" type="button">−1</button><button class="btn-sub" data-d="-0.1" type="button">−0.1</button>
        <button class="btn-sub" data-d="0.1" type="button">+0.1</button><button class="btn-sub" data-d="1" type="button">+1</button>
        <button class="btn-sub" id="nowBtn" type="button">今の位置（N）</button><button class="btn-sub" id="playManual" type="button">▶（3）</button>
        <button class="btn-sub" id="setBtn" type="button">この位置で決める</button></div>
      <div class="rv-keys">1・2・3：直す前／自動の値／手で決めた位置から聴く　Enter：OK　Backspace：元に戻す　N：今の位置　J・K：次・前の曲　スペース：止める・流す</div>
    </aside>
  </div>
</main>
<div class="toast" id="toast" hidden></div>
<script type="module" src="review.js"></script>
</body>
</html>
