<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>収録曲一覧｜アニソンイントロ対戦</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="イントロ対戦">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css" media="(max-width: 600px)">
<link rel="stylesheet" href="songs.css">
</head>
<body class="songs-page">
<div class="backdrop" aria-hidden="true"></div>
<main class="songs-main">
  <header class="top">
    <a class="brand" href="/">
      <img class="emblem" src="assets/glass/logo.webp" alt="">
      <h1 class="logo"><small>ANISONG INTRO BATTLE</small>アニソン<em>イントロ</em>対戦</h1>
    </a>
    <a class="btn-sub" href="stats.html" title="流れた曲の回数・正解率のランキングなど">📊 流れた曲の統計</a><a class="btn-sub back-home" href="/">← トップへ</a>
  </header>

  <section class="panel">
    <h2 class="songs-title">収録曲一覧 <span id="count"></span></h2>
    <div class="songs-tools">
      <input id="q" type="search" placeholder="曲名・作品名・歌手で探す" autocomplete="off">
      <select id="genre"><option value="">ジャンル：すべて</option></select>
      <select id="fame"><option value="">知名度：すべて</option></select>
      <select id="decade"><option value="">年代：すべて</option></select>
      <select id="sort">
        <option value="title">曲名順</option><option value="work">作品名順</option><option value="year">年順</option>
        <option value="genre">ジャンル順</option><option value="fame">知名度順</option><option value="artist">歌手順</option>
        <option value="plays">流れた回数順</option><option value="rate">正解率順</option>
      </select>
      <button class="btn-sub" id="order" type="button" title="昇順・降順を切り替え">↑ 昇順</button>
      <select id="view"><option value="list">一覧で表示</option><option value="work">作品ごとに表示</option><option value="genre">ジャンルごとに表示</option></select>
      <label class="fix-only"><input type="checkbox" id="fixOnly"> 修正待ちだけ</label>
      <label class="fix-only" title="音の自動チェックで、サビの位置がずれている・原曲でない（ライブ版など）かもしれない曲"><input type="checkbox" id="warnOnly"> 自動チェックで要確認だけ</label>
      <label class="fix-only" title="自動の解析で、イントロの頭（セリフ・歓声・効果音）を飛ばした曲・サビを推定し直した曲。違っていたら、曲を開いて直して送ってください"><input type="checkbox" id="autoOnly"> 自動で直した曲だけ</label>
    </div>
    <p class="note">曲を選ぶと、試し聴きしながらイントロ・サビの位置を直せます。直した位置は「修正待ち」になり、次のサイト更新で反映されます。</p>
    <div id="list" class="songs-list"><p class="note">読み込み中…</p></div>
    <button class="btn-sub" id="more" hidden>もっと見る</button>
  </section>
  <p class="note credit">サビの位置の一部は、<a href="https://songle.jp/" target="_blank" rel="noopener">Songle</a>（産業技術総合研究所）の音楽解析の結果を参考にしています。</p>
</main>

<!-- 編集（PCは右側、スマホは下から） -->
<aside class="song-editor" id="editor" hidden>
  <button class="btn-sub ed-close" id="edClose" type="button">閉じる</button>
  <div class="ed-head"><b id="edTitle"></b><small id="edMeta"></small></div>
  <div class="ed-player"><div id="player"></div></div>
  <div class="fix-row"><b>イントロ</b><span class="fix-sec" id="edIntro"></span>
    <span class="fix-btns"><button class="btn-sub" data-k="intro" data-d="-1">−1</button><button class="btn-sub" data-k="intro" data-d="-0.1">−0.1</button><button class="btn-sub" data-k="intro" data-d="0.1">+0.1</button><button class="btn-sub" data-k="intro" data-d="1">+1</button><button class="btn-sub" data-now="intro">今の位置</button><button class="btn-sub" data-play="intro">▶ 聴く</button></span></div>
  <div class="fix-row"><b>サビ</b><span class="fix-sec" id="edChorus"></span>
    <span class="fix-btns"><button class="btn-sub" data-k="chorus" data-d="-1">−1</button><button class="btn-sub" data-k="chorus" data-d="-0.1">−0.1</button><button class="btn-sub" data-k="chorus" data-d="0.1">+0.1</button><button class="btn-sub" data-k="chorus" data-d="1">+1</button><button class="btn-sub" data-now="chorus">今の位置</button><button class="btn-sub" data-play="chorus">▶ 聴く</button></span></div>
  <p class="note" id="edNote"></p>
  <div class="fix-actions"><button class="btn-main" id="edSend" type="button">この位置で送る</button><button class="btn-sub" id="edReset" type="button">元に戻す</button></div>
  <div class="fix-actions me-tools" id="edMe"></div>
  <div class="genre-edit fame-edit"><b>知名度</b><div class="genre-checks" id="edFame"></div>
    <div class="fix-actions"><button class="btn-sub" id="edFameAuto" type="button">自動に戻す</button></div>
    <p class="note" id="edFameNote"></p></div>
  <div class="genre-edit"><b>ジャンル</b><div class="genre-checks" id="edGenres"></div>
    <div class="fix-actions"><button class="btn-sub" id="edGenreSend" type="button">ジャンルを送る</button><button class="btn-sub" id="edGenreAuto" type="button">自動に戻す</button></div>
    <p class="note" id="edGenreNote"></p></div>
  <div class="report-actions">
    <button class="btn-sub" id="repWrong" type="button" title="動画の曲が違う（別の曲・別の歌手など）。次の更新で正しい動画を探し直します">🔁 曲が違う（探し直す）</button>
    <button class="btn-sub" id="repDelete" type="button" title="この曲を出題から外してほしい">🗑 削除を依頼</button>
  </div>
  <div class="report-form" id="repForm" hidden>
    <b id="repTitle"></b>
    <textarea id="repNote" rows="2" maxlength="200"></textarea>
    <div class="fix-actions"><button class="btn-main" id="repSend" type="button">送る</button><button class="btn-sub" id="repCancel" type="button">やめる</button></div>
  </div>
  <p class="note" id="repInfo"></p>
</aside>
<div class="toast" id="toast" hidden></div>
<script type="module" src="songs.js"></script>
</body>
</html>
